<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;background:#140c07;display:flex;justify-content:center;align-items:center;height:100vh}canvas{border:3px solid #8b5a2b;background:#24140a}</style></head><body><canvas id=c width="400" height="600"></canvas><script>
const c=document.getElementById('c'),x=c.getContext('2d');let A,s=h=0,g=1,px=200,B=[],P=[];
const S=(f,t,d)=>{if(A){let o=A.createOscillator(),e=A.createGain();o.type=t;o.frequency.value=f;e.gain.setValueAtTime(.1,A.currentTime);e.gain.exponentialRampToValueAtTime(.01,A.currentTime+d);o.connect(e);e.connect(A.destination);o.start();o.stop(A.currentTime+d)}};
c.onmousemove=e=>px=Math.max(20,Math.min(380,e.clientX-c.getBoundingClientRect().left));
c.onclick=()=>{if(!A)A=new AudioContext;if(!g){g=1;s=0;B=[];P=[]}};
(function L(){
x.fillStyle='#24140a';x.fillRect(0,0,400,600);
if(g){
if(Math.random()<.05)B.push({x:20+Math.random()*360,y:-20,t:Math.random()<.3?0:1,v:3+s*.02,r:.1*Math.random()-.05});
x.fillStyle='#c8963e';x.beginPath();x.ellipse(px,530,20,15,0,0,7);x.fill();
P.forEach((p,i)=>{p.x+=p.v;p.y+=p.w;p.a-=.04;x.fillStyle=p.c;x.globalAlpha=Math.max(0,p.a);x.fillRect(p.x,p.y,4,4);if(p.a<=0)P.splice(i,1)});
x.globalAlpha=1;
B.forEach((b,i)=>{
b.y+=b.v;x.fillStyle=b.t?'#e53935':'#ffd700';x.fillRect(b.x-8,b.y-8,16,16);
if(Math.hypot(b.x-px,b.y-530)<25){
if(!b.t){s+=10;S(600,'sine',.1);for(let k=8;k--;)P.push({x:b.x,y:b.y,v:Math.random()*6-3,w:Math.random()*6-3,a:1,c:'#ffd700'})}
else{g=0;h=Math.max(h,s);S(100,'sawtooth',.3);for(let k=20;k--;)P.push({x:px,y:530,v:Math.random()*10-5,w:Math.random()*10-5,a:1,c:'#c8963e'})}
B.splice(i,1);
}else if(b.y>620)B.splice(i,1);
});
x.fillStyle='#fff';x.font='18px sans-serif';x.fillText('BUTTER:'+s,10,25);
}else{
x.fillStyle='#fff';x.font='30px sans-serif';x.fillText('MASHED!',130,280);
x.font='16px sans-serif';x.fillText(`Score:${s} Best:${h}`,145,320);x.fillText('Click to restart',140,360);
}
requestAnimationFrame(L);
})();
</script></body></html>
